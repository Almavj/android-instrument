services:
  c2_server:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: python3 c2_server.py --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"

  orchestrator:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: bash -lc "python3 pre_flight_check.py --json && python3 run_pipeline.sh /app/test.apk"
    depends_on:
      - c2_server
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: feature_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
