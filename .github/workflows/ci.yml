name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/cache@v4
        with:
          path: ~/.android/sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: android-sdk-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jdk-headless unzip wget curl python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
      - name: Install Android SDK
        run: |
          mkdir -p $HOME/Android/Sdk/cmdline-tools/latest
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cli.zip
          unzip -q /tmp/cli.zip -d /tmp/cli
          cp -r /tmp/cli/cmdline-tools/* $HOME/Android/Sdk/cmdline-tools/latest/
          yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/Android/Sdk "platform-tools" "platforms;android-30" "build-tools;30.0.3" "system-images;android-30;google_apis;x86_64" "emulator"
      - name: Create AVD
        run: |
          echo "no" | $HOME/Android/Sdk/cmdline-tools/latest/bin/avdmanager create avd -n pixel_6_api_30 -k "system-images;android-30;google_apis;x86_64" -d "pixel_6" --force
      - name: Pre-flight
        run: |
          python3 pre_flight_check.py --json > /tmp/preflight.json
          python3 pre_flight_check.py >/tmp/preflight.txt
          test $? -eq 0
      - name: Run tests
        run: |
          pytest --cov=. --cov-report=xml
      - name: Start emulator
        run: |
          export ANDROID_HOME=$HOME/Android/Sdk
          export ANDROID_SDK_ROOT=$HOME/Android/Sdk
          nohup $HOME/Android/Sdk/emulator/emulator -avd pixel_6_api_30 -no-window -no-audio -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          adb wait-for-device
      - name: Run pipeline
        run: |
          wget -q -O /tmp/test.apk https://github.com/commonsguy/cw-omnibus/raw/master/Basic/HelloAndroid/app/build/outputs/apk/debug/app-debug.apk || true
          if [ -f /tmp/test.apk ]; then ./run_pipeline.sh /tmp/test.apk; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            results/
            /tmp/emulator.log
            /tmp/preflight.json
            /tmp/preflight.txt
            coverage.xml
