logging:
  level: INFO
  format: '%(asctime)s %(levelname)s %(message)s'
  file: ./logs/app.log

paths:
  apktool: apktool
  adb: adb
  android_sdk: ${ANDROID_HOME}
  genymotion: ~/Documents/Tools/genymotion
  gmtool: ~/Documents/Tools/genymotion/gmtool
  frida: frida

c2:
  host: 0.0.0.0
  port: 5000
  # Host IP reachable from Genymotion VMs (VirtualBox host-only is often 10.0.3.2)
  public_host: 10.0.3.2
  commands:
    - EXFIL_ALL
    - GET_DEVICE_INFO
    - LIST_APPS
    - EXFIL_SMS
    - EXFIL_CONTACTS
    - GET_LOCATION

emulator:
  backend: genymotion
  avd_name: pixel_6_api_30
  vm_name: Genymotion Phone
  ram: 2048
  cores: 2
  port: 5554
  no_window: true
  serial: ""

analysis:
  timeout: 300
  frida_enabled: true
  frida_script: frida_hooks.js
  frida_duration: 45
  monkey_events: 50
  grant_permissions: true
  pull_db: true

feature_extraction:
  feature_set: default
  output_format: json

physical_device:
  enabled: false
  serial: null
  allow_root: false
  install_options: "-r -t"
  timeout: 300
